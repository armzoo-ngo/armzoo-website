<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Շնորհակալություն | ARMZOO NGO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f8f5;
      color: #243126;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #2f7d4a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 18px;
      color: #2f7d4a;
    }

    p {
      line-height: 1.6;
      margin: 12px 0;
    }

    .note {
      margin-top: 25px;
      padding: 15px;
      background: #f2f7f3;
      border-radius: 12px;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 26px;
      background: #2f7d4a;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="check">✓</div>

    <h1>Շնորհակալություն</h1>

    <p>
      Ձեր վճարման գործընթացն ավարտվել է։
      Շնորհակալություն ARMZOO NGO-ին աջակցելու համար։
    </p>

    <p>
      Thank you for supporting ARMZOO NGO.
    </p>

    <p>
      Спасибо за поддержку ARMZOO NGO.
    </p>

    <div class="note">
      Վճարման վերջնական կարգավիճակը հաստատվում է
      վճարային համակարգից ստացված տվյալների հիման վրա։
    </div>

    <a class="button" href="/">
      Վերադառնալ գլխավոր էջ
    </a>

  </main>

</body>
</html>
